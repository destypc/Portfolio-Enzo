<!doctype html>
<html lang="pt-BR" data-theme="dark" data-accent="mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ─────────────────────────────────────── -->
    <title>Enzo Nascimento — Desenvolvedor Web Front-End & Back-End</title>
    <meta
      name="description"
      content="Portfólio de Enzo Nascimento, desenvolvedor web júnior. Crio interfaces modernas e responsivas com HTML, CSS, JavaScript, PHP e SQL."
    />
    <meta
      name="keywords"
      content="Enzo Nascimento, desenvolvedor web, front-end, back-end, portfólio, HTML, CSS, JavaScript, PHP, SQL, MySQL, programador júnior"
    />
    <meta name="author" content="Enzo Nascimento" />
    <meta name="theme-color" content="#060608" />
    <link rel="canonical" href="https://destypc.github.io/Projeto-Portfolio/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Enzo Nascimento — Desenvolvedor Web" />
    <meta
      property="og:description"
      content="Portfólio de Enzo Nascimento, desenvolvedor web júnior. Interfaces modernas com HTML, CSS, JavaScript, PHP e SQL."
    />
    <meta property="og:image" content="assets/images/enzo-home.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ── Prevenção de FOUC: aplica tema salvo antes da pintura ── -->
    <script>
      (function () {
        try {
          const root = document.documentElement;
          const theme = localStorage.getItem("theme");
          const accent = localStorage.getItem("accent");
          const lang = localStorage.getItem("lang");
          if (theme) root.setAttribute("data-theme", theme);
          if (accent) root.setAttribute("data-accent", accent);
          if (lang) {
            const locales = { pt: "pt-BR", en: "en", es: "es" };
            if (locales[lang]) root.setAttribute("lang", locales[lang]);
          }
          // Trava o scroll enquanto a tela de carregamento aparece.
          root.classList.add("is-loading");
        } catch (_) {}
      })();
    </script>

    <!-- ── Fontes ──────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ── Ícones (Font Awesome) ───────────────────── -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- ── Estilos ─────────────────────────────────── -->
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />

    <!-- ── Favicon ─────────────────────────────────── -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060608'/%3E%3Ctext x='8' y='24' font-family='Arial Black,sans-serif' font-size='22' font-weight='900' fill='%23ffffff'%3EE%3C/text%3E%3Ccircle cx='25' cy='22' r='3.5' fill='%23a9b0be'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Tela de carregamento (preloader) -->
    <div
      class="preloader"
      id="preloader"
      role="status"
      aria-label="Carregando"
      data-i18n-aria="preloader.aria"
    >
      <div class="preloader__inner">
        <span class="preloader__logo">Enzo<span>.</span></span>
        <span class="preloader__bar" aria-hidden="true">
          <span class="preloader__bar-fill"></span>
        </span>
      </div>
    </div>

    <!-- Fundo ambiente vivo (orbs desfocados + grade sutil) -->
    <div class="bg-ambient" aria-hidden="true">
      <span class="bg-orb bg-orb--1"></span>
      <span class="bg-orb bg-orb--2"></span>
      <span class="bg-orb bg-orb--3"></span>
    </div>

    <!-- Barra de progresso de leitura -->
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <!-- Link de acessibilidade: pular para o conteúdo -->
    <a href="#home" class="skip-link" data-i18n="skip">Pular para o conteúdo</a>

    <div data-include="components/navbar.html"></div>

    <main>
      <div data-include="sections/hero.html"></div>

      <div data-include="sections/sobre.html"></div>

      <div data-include="sections/jornada.html"></div>

      <div data-include="sections/projetos.html"></div>

      <div data-include="sections/skills.html"></div>

      <div data-include="sections/contato.html"></div>
    </main>

    <div data-include="components/footer.html"></div>

    <!-- Botão flutuante: voltar ao topo -->
    <button
      type="button"
      class="scroll-top"
      id="scrollTop"
      data-tooltip="Voltar ao topo"
      aria-label="Voltar ao topo"
    >
      <i class="fas fa-arrow-up" aria-hidden="true"></i>
    </button>

    <!-- ── Scripts (módulos ES) ────────────────────── -->
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
