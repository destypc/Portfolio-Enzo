<!-- ================= CONTATO ================= -->
<section id="contato" class="section contato">
  <div class="container">
    <header class="section__header reveal">
      <p class="eyebrow" data-i18n="contact.eyebrow">Contato</p>
      <h2 class="section__title" data-i18n-html="contact.title">
        Vamos <span>conversar</span>
      </h2>
      <p class="section__subtitle" data-i18n="contact.subtitle">
        Quer falar comigo? Escolha o canal que preferir — costumo
        responder bem rápido!
      </p>
    </header>

    <div class="contact-cards reveal">
      <a
        href="https://wa.me/554599857429"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-card contact-card--whatsapp spotlight"
        data-tilt
        data-tilt-max="6"
      >
        <span class="contact-card__icon"
          ><i class="fab fa-whatsapp" aria-hidden="true"></i
        ></span>
        <span class="contact-card__label">WhatsApp</span>
        <span class="contact-card__value">+55 (45) 99850-7429</span>
        <span class="contact-card__cta"
          ><span data-i18n="contact.waCta">Chamar agora</span>
          <i class="fas fa-arrow-right" aria-hidden="true"></i
        ></span>
      </a>

      <a
        href="https://github.com/destypc"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-card contact-card--github spotlight"
        data-tilt
        data-tilt-max="6"
      >
        <span class="contact-card__icon"
          ><i class="fab fa-github" aria-hidden="true"></i
        ></span>
        <span class="contact-card__label">GitHub</span>
        <span class="contact-card__value">@destypc</span>
        <span class="contact-card__cta"
          ><span data-i18n="contact.ghCta">Ver perfil</span>
          <i class="fas fa-arrow-right" aria-hidden="true"></i
        ></span>
      </a>

      <a
        href="mailto:enzopontesdonascimento@gmail.com"
        class="contact-card contact-card--email spotlight"
        data-tilt
        data-tilt-max="6"
      >
        <span class="contact-card__icon"
          ><i class="fas fa-envelope" aria-hidden="true"></i
        ></span>
        <span class="contact-card__label">E-mail</span>
        <span class="contact-card__value"
          >enzopontesdonascimento@gmail.com</span
        >
        <span class="contact-card__cta"
          ><span data-i18n="contact.mailCta">Enviar e-mail</span>
          <i class="fas fa-arrow-right" aria-hidden="true"></i
        ></span>
      </a>
    </div>
  </div>
</section>
